<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Updates of AI</title>
</head>
<body>
  <h1>🧠 Updates of AI</h1>
  <ul id="news-list"></ul>

<script>
// CLEAN & SIMPLE fetch from Supabase
async function loadNews() {
  const url = 'https://irscxgxamubypdxtehuv.supabase.co/rest/v1/news';
  const apiKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyc2N4Z3hhbXVieXBkeHRlaHV2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1Mjc5NDQ1OSwiZXhwIjoyMDY4MzcwNDU5fQ.6ZXVQYya_MnWdcoHOfGYiq2GhLUvLiDn5h6RWWJrHo0';
  const res = await fetch(url, {
    headers: {
      apikey: apiKey,
      'Content-Type': 'application/json'
    }
  });
  const items = await res.json();
  const list = document.getElementById('news-list');
  items.forEach(item => {
    const li = document.createElement('li');
    li.innerHTML = `<strong>${item.title}</strong> — <a href="${item.source_url}" target="_blank">${item.source_name}</a>`;
    list.appendChild(li);
  });
}
loadNews();
</script>

</body>
</html>
